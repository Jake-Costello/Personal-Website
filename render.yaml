# One paid API service. The portfolio remains on GitHub Pages.
# https://render.com/docs/blueprint-spec
# Optional AI: set OPENAI_API_KEY and AI_EXPLANATIONS_ENABLED=true in the service
# Environment after deployment. Keep the key out of this public Blueprint.
# See docs/AI-EXPLANATIONS.md for the approved $5/month project spend controls.
services:
  - type: web
    name: personal-website-protein-api
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    branch: main
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements-lock.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: ALLOWED_ORIGINS
        value: https://jake-costello.com,https://www.jake-costello.com,http://jake-costello.com,http://www.jake-costello.com,https://jake-costello.github.io
